name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build static site
        run: npm run build

      - name: Check SEO output
        run: |
          test -f out/CNAME && grep -qx 'raiokiuai.com' out/CNAME
          test -f out/sitemap.xml && test -f out/robots.txt && test -f out/404.html
          for f in out/index.html out/*/index.html; do
            # The 404 page and noindex pages (e.g. /brand/) are not meant to be indexed, so skip them.
            case "$f" in out/404/*) continue ;; esac
            grep -q 'noindex' "$f" && continue
            grep -q 'rel="canonical"' "$f" || { echo "missing canonical: $f"; exit 1; }
            grep -q 'google-site-verification' "$f" || { echo "missing verification tag: $f"; exit 1; }
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
